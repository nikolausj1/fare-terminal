name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      # data/fare-terminal.db is gitignored, so this checkout has no DB
      # file yet — scripts/build.mjs detects that and runs
      # db:setup + seed + pipeline before `next build` itself (see
      # docs/RUNBOOK.md's "Where things live on Vercel" section for the
      # same guard in the Vercel build).
      - name: Build (self-seeds the demo DB, then next build)
        run: npm run build

  # End-to-end (Playwright) tests are intentionally NOT run in CI yet, to
  # keep the required-checks pipeline fast — they're a local/pre-merge gate
  # today (`npm run test:e2e`, see the Testing section of README.md).
  # Uncomment once the suite has proven stable in CI (webServer cold start
  # + chromium install add real minutes to every PR):
  #
  # e2e:
  #   runs-on: ubuntu-latest
  #   needs: build-and-test
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run db:setup && npm run seed && npm run pipeline
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run test:e2e
